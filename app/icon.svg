<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Ticket Gradient -->
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Gear/Resolution Gradient -->
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Checkmark Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Tech Background -->
  <rect width="800" height="800" rx="160" fill="url(#bgGrad)" />

  <!-- Decorative Background Grid Lines (Subtle Tech Aesthetic) -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="2">
    <line x1="100" y1="0" x2="100" y2="800" />
    <line x1="200" y1="0" x2="200" y2="800" />
    <line x1="300" y1="0" x2="300" y2="800" />
    <line x1="400" y1="0" x2="400" y2="800" />
    <line x1="500" y1="0" x2="500" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
    <line x1="700" y1="0" x2="700" y2="800" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="0" y1="700" x2="800" y2="700" />
  </g>

  <!-- LOGO ICON GROUP -->
  <g transform="translate(0, -30)">
    
    <!-- Left/Back Support Ticket (Queue) -->
    <path d="M 230 280 
             L 410 190 
             A 25 25 0 0 1 444 202
             L 514 342 
             A 25 25 0 0 1 502 376
             L 322 466 
             A 25 25 0 0 1 288 454
             L 218 314
             A 25 25 0 0 1 230 280 Z" 
          fill="#1e40af" opacity="0.4" transform="rotate(-5, 366, 328)" />

    <!-- Main Front Ticket Body -->
    <g filter="url(#dropShadow)">
      <!-- Ticket Shape with Left/Right Circular Side Notches -->
      <path d="M 280 300 
               H 400 
               A 30 30 0 0 0 400 360 
               H 280 
               A 30 30 0 0 0 280 300 Z" 
            fill="url(#ticketGrad)" 
            transform="rotate(-15, 340, 330) scale(2.4)" />
      
      <!-- Ticket Tech Details / Dash Lines Inside -->
      <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.3" transform="rotate(-15, 340, 330) translate(250, 290) scale(2.4)">
        <line x1="25" y1="25" x2="55" y2="25" />
        <line x1="25" y1="35" x2="45" y2="35" />
      </g>
      
      <!-- Ticket Barcode Representation -->
      <g fill="#ffffff" opacity="0.25" transform="rotate(-15, 340, 330) translate(250, 290) scale(2.4)">
        <rect x="75" y="22" width="4" height="16" />
        <rect x="82" y="22" width="2" height="16" />
        <rect x="87" y="22" width="6" height="16" />
        <rect x="96" y="22" width="3" height="16" />
      </g>
    </g>

    <!-- Automation & Processing Gear (Intersects the Ticket) -->
    <g filter="url(#dropShadow)" transform="translate(500, 440)">
      <!-- Gear Rotation Baseline -->
      <g transform="rotate(12)">
        <!-- Outer Teeth (8 Teeth) -->
        <g fill="url(#gearGrad)">
          <rect x="-25" y="-115" width="50" height="230" rx="12" />
          <rect x="-25" y="-115" width="50" height="230" rx="12" transform="rotate(45)" />
          <rect x="-25" y="-115" width="50" height="230" rx="12" transform="rotate(90)" />
          <rect x="-25" y="-115" width="50" height="230" rx="12" transform="rotate(135)" />
        </g>
        <!-- Core Center Body of Gear -->
        <circle cx="0" cy="0" r="95" fill="url(#gearGrad)" />
      </g>
      
      <!-- Inner Dynamic Resolution Ring -->
      <circle cx="0" cy="0" r="60" fill="#065f46" />
      
      <!-- Sharp Successful Resolution Checkmark -->
      <path d="M -22 2 L -7 17 L 25 -20" 
            fill="none" 
            stroke="url(#checkGrad)" 
            stroke-width="16" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            filter="url(#glow)" />
    </g>

    <!-- Diagnostic/Data Nodes (Floating System Elements) -->
    <g fill="#10b981" filter="url(#glow)">
      <circle cx="500" cy="230" r="10" />
      <circle cx="210" cy="460" r="7" opacity="0.7" />
    </g>
    <g fill="#3b82f6" filter="url(#glow)">
      <circle cx="180" cy="260" r="12" />
      <circle cx="610" cy="320" r="8" opacity="0.6" />
    </g>
    
    <!-- Connection Lines Between Nodes (System Data Flow) -->
    <path d="M 480 235 Q 440 260 410 240" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="8 6" opacity="0.4" />
    <path d="M 590 335 Q 560 370 570 400" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="8 6" opacity="0.4" />

  </g>

  <!-- LOGO TYPOGRAPHY -->
  <text x="400" y="670" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="52" 
        font-weight="800" 
        letter-spacing="4" 
        fill="#ffffff" 
        text-anchor="middle">
    TICKETING<tspan fill="#10b981"> SYSTEM</tspan>
  </text>
  
  <text x="400" y="715" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="20" 
        font-weight="500" 
        letter-spacing="8" 
        fill="#94a3b8" 
        text-anchor="middle">
    AUTOMATED RESOLUTION SYSTEM
  </text>
</svg>
